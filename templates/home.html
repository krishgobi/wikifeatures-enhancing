<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <title>தமிழ் விக்கிப்பீடியா கருவிகள்</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --background-color: #f8f9fa;
      --text-color: #333;
      --card-background: #fff;
      --border-color: #ddd;
      --highlight-color: #357ae8;
      --highlight-hover: #2868c7;
      --icon-background: #f0f5ff;
      --icon-hover: #e0eaff;
      --box-shadow: rgba(0,0,0,0.1);
      --nav-background: #fff;
      --chat-user-bg: #e1f5fe;
      --chat-user-color: #01579b;
      --chat-bot-bg: white;
      --chat-bot-color: #333;
      --chat-bot-border: #e0e0e0;
      --result-background: #f9f9f9;
      --light-text: #666;
    }

    .dark-theme {
      --background-color: #121212;
      --text-color: #e0e0e0;
      --card-background: #1e1e1e;
      --border-color: #333;
      --highlight-color: #4285f4;
      --highlight-hover: #5a95f5;
      --icon-background: #2c2c2c;
      --icon-hover: #3c3c3c;
      --box-shadow: rgba(0,0,0,0.3);
      --nav-background: #1a1a1a;
      --chat-user-bg: #1a3b50;
      --chat-user-color: #90caf9;
      --chat-bot-bg: #2c2c2c;
      --chat-bot-color: #e0e0e0;
      --chat-bot-border: #444;
      --result-background: #262626;
      --light-text: #aaa;
    }
    
    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      background-color: var(--card-background);
    }
    
    /* Top Navigation Bar */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--nav-background);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px var(--box-shadow);
      z-index: 1000;
      height: 50px;
      transition: background-color 0.3s;
    }
    
    .nav-logo {
      font-weight: bold;
      font-size: 18px;
      color: var(--highlight-color);
    }
    
    .nav-tools {
      display: flex;
      gap: 15px;
    }
    
    .tool-icon {
      background: var(--icon-background);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--highlight-color);
      font-size: 16px;
    }
    
    .tool-icon:hover {
      background: var(--icon-hover);
      transform: scale(1.05);
    }
    
    .tool-icon.active {
      background: var(--highlight-color);
      color: white;
    }
    
    /* Main Content Area with Padding for Top Nav */
    .main-content {
      padding-top: 60px;
      width: 100%;
      height: calc(100vh - 60px);
    }
    
    /* Tool Panels */
    .tool-panel {
      position: fixed;
      top: 60px;
      right: 0;
      width: 350px;
      background: var(--card-background);
      border-left: 1px solid var(--border-color);
      height: calc(100vh - 60px);
      box-shadow: -2px 0 8px var(--box-shadow);
      padding: 15px;
      display: none;
      overflow-y: auto;
      z-index: 900;
      transition: all 0.3s ease;
      transform: translateX(100%);
    }
    
    .tool-panel.active {
      display: block;
      transform: translateX(0);
    }
    
    .panel-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: var(--text-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .close-panel {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--light-text);
    }
    
    /* Form Styles */
    .form-card {
      background: var(--card-background);
      border-radius: 8px;
      box-shadow: 0 1px 3px var(--box-shadow);
      padding: 15px;
      margin-bottom: 15px;
    }
    
    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    
    .form-group {
      flex: 1;
    }
    
    .form-label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-color);
    }
    
    .form-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      background-color: var(--card-background);
      color: var(--text-color);
    }
    
    .form-input:focus {
      border-color: var(--highlight-color);
      outline: none;
      box-shadow: 0 0 0 2px rgba(53, 122, 232, 0.2);
    }
    
    textarea.form-input {
      resize: vertical;
      min-height: 60px;
    }
    
    .btn {
      background: var(--highlight-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    .btn:hover {
      background: var(--highlight-hover);
    }
    
    .btn-sm {
      padding: 6px 10px;
      font-size: 13px;
    }
    
    /* Result Cards */
    .result-card {
      background: var(--result-background);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      border: 1px solid var(--border-color);
    }
    
    .result-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text-color);
    }
    
    .result-content {
      font-size: 14px;
      color: var(--text-color);
      white-space: pre-line;
      max-height: 200px;
      overflow-y: auto;
      padding: 8px;
      background: var(--card-background);
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }
    
    /* Chat Window */
    .chat-icon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 55px;
      height: 55px;
      background: var(--highlight-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 10px var(--box-shadow);
      z-index: 1100;
      transition: all 0.3s;
    }
    
    .chat-icon:hover {
      transform: scale(1.05);
      background: var(--highlight-hover);
    }
    
    .chat-window {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      height: 450px;
      background: var(--card-background);
      border-radius: 10px;
      box-shadow: 0 5px 25px var(--box-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1100;
      transition: all 0.3s;
      transform: scale(0);
      transform-origin: bottom right;
      opacity: 0;
    }
    
    .chat-window.active {
      transform: scale(1);
      opacity: 1;
    }
    
    .chat-header {
      padding: 15px;
      background: var(--highlight-color);
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .chat-close {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: var(--background-color);
    }
    
    .chat-input-area {
      padding: 10px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }
    
    .chat-input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      resize: none;
      background-color: var(--card-background);
      color: var(--text-color);
    }
    
    .chat-send {
      background: var(--highlight-color);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .message {
      margin-bottom: 10px;
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 18px;
      position: relative;
      font-size: 14px;
      line-height: 1.4;
    }
    
    .user-message {
      background: var(--chat-user-bg);
      color: var(--chat-user-color);
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    
    .bot-message {
      background: var(--chat-bot-bg);
      color: var(--chat-bot-color);
      border: 1px solid var(--chat-bot-border);
      border-bottom-left-radius: 4px;
    }
    
    /* Loading Indicator */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: var(--highlight-color);
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    .loading-text {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      color: var(--light-text);
      font-size: 14px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .tool-panel {
        width: 100%;
        border-left: none;
      }
      
      .chat-window {
        width: 90%;
        right: 5%;
        bottom: 80px;
      }
    }

    /* Theme toggle styles */
    .theme-toggle {
      background: var(--icon-background);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--highlight-color);
      font-size: 16px;
      margin-right: 15px;
    }
    
    .theme-toggle:hover {
      background: var(--icon-hover);
      transform: scale(1.05);
    }

    /* Dark mode specific adjustments */
    .dark-theme .loading {
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--highlight-color);
    }
  </style>
</head>
<body class="light-theme">
  <!-- Top Navigation Bar -->
  <div class="top-nav">
    <div class="nav-logo">தமிழ் விக்கிப்பீடியா</div>
    <div class="nav-tools">
      <button class="theme-toggle" id="theme-toggle" title="தீம் மாற்று">
        <i class="fas fa-moon"></i>
      </button>
      <button class="tool-icon" id="voice-tool" title="குரல் உதவி">
        <i class="fas fa-microphone"></i>
      </button>
      <button class="tool-icon" id="image-tool" title="படத்திற்கான விளக்கம்">
        <i class="fas fa-image"></i>
      </button>
      <button class="tool-icon" id="content-tool" title="உள்ளடக்க பரிந்துரை">
        <i class="fas fa-pen-to-square"></i>
      </button>
      
      <button class="tool-icon" id="new-article" title="புதிய கட்டுரை எழுத">
        <i class="fas fa-pen"></i> <span></span>
      </button>
      
    </div>
  </div>

  <!-- Main Wiki Content -->
  <div class="main-content">
    <iframe id="wikiFrame" src="https://ta.wikipedia.org/wiki/முதல்_பக்கம்"></iframe>
  </div>

  <!-- Voice Tool Panel -->
  <div class="tool-panel" id="voice-panel">
    <div class="panel-title">
      குரல் உதவி
      <button class="close-panel"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-card">
      <p>குரல் மூலம் விக்கிப்பீடியாவில் தேட:</p>
      <button class="btn" onclick="startVoiceRecognition()">
        <i class="fas fa-microphone"></i> குரல் பதிவை தொடங்கு
      </button>
    </div>
  </div>

  <!-- Image Caption Tool Panel -->
  <div class="tool-panel" id="image-panel">
    <div class="panel-title">
      படத்திற்கான விளக்கம்
      <button class="close-panel"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-card">
      <form id="imageForm" enctype="multipart/form-data">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="imageInput">
              <i class="fas fa-file-image"></i> படம்:
            </label>
            <input class="form-input" type="file" id="imageInput" name="image" accept="image/*" required>
          </div>
          <div class="form-group" style="max-width: 80px;">
            <label class="form-label" for="lines">வரிகள்:</label>
            <input class="form-input" type="number" id="lines" name="lines" value="5" min="1" max="10" required>
          </div>
        </div>
        <button type="submit" class="btn">
          <i class="fas fa-magic"></i> விளக்கம் உருவாக்கு
        </button>
      </form>
      <div id="loadingIndicator" class="loading-text" style="display: none;">
        <div class="loading"></div> விளக்கம் உருவாக்குகிறது...
      </div>
    </div>
    
    <div class="result-card" id="captionResultCard" style="display: none;">
      <div class="result-title">விளக்கம்:</div>
      <div class="result-content" id="captionResult"></div>
    </div>
  </div>

  <!-- Content Suggestion Tool Panel -->
  <div class="tool-panel" id="content-panel">
    <div class="panel-title">
      உள்ளடக்க பரிந்துரை
      <button class="close-panel"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-card">
      <div class="form-group">
        <label class="form-label" for="content">உள்ளடக்கம் உள்ளிடவும்:</label>
        <textarea class="form-input" id="content" rows="4" placeholder="இங்கே உள்ளடக்கத்தை உள்ளிடவும்..."></textarea>
      </div>
      <button class="btn" onclick="suggestMissingContent()">
        <i class="fas fa-lightbulb"></i> பரிந்துரைகள் பெறு
      </button>
      <div id="suggestionLoading" class="loading-text" style="display: none;">
        <div class="loading"></div> பரிந்துரைகள் பெறுகிறது...
      </div>
    </div>
    
    <div class="result-card" id="suggestionResultCard" style="display: none;">
      <div class="result-title">பரிந்துரை:</div>
      <div class="result-content" id="suggestionResult"></div>
    </div>
  </div>

  <!-- Chat Icon -->
  <div class="chat-icon" id="chat-toggle">
    <i class="fas fa-comments"></i>
  </div>

  <!-- Chat Window -->
  <div class="chat-window" id="chat-window">
    <div class="chat-header">
      விக்கி உதவியாளர்
      <button class="chat-close" id="chat-close">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="message bot-message">
        வணக்கம்! நான் தமிழ் விக்கிப்பீடியா உதவியாளர். உங்களுக்கு எப்படி உதவ முடியும்?
      </div>
    </div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chatMessage" placeholder="இங்கே உங்கள் கேள்வியை தட்டச்சு செய்யவும்..."></textarea>
      <button class="chat-send" id="chatSend">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <script>
    // Theme Toggle
    let isDarkTheme = false;
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = themeToggle.querySelector('i');
    
    themeToggle.addEventListener('click', function() {
      isDarkTheme = !isDarkTheme;
      if (isDarkTheme) {
        document.body.classList.remove('light-theme');
        document.body.classList.add('dark-theme');
        themeIcon.classList.remove('fa-moon');
        themeIcon.classList.add('fa-sun');
      } else {
        document.body.classList.remove('dark-theme');
        document.body.classList.add('light-theme');
        themeIcon.classList.remove('fa-sun');
        themeIcon.classList.add('fa-moon');
      }
    });

    // Tool Panel Toggle
    const toolIcons = document.querySelectorAll('.tool-icon');
    const toolPanels = document.querySelectorAll('.tool-panel');
    
    toolIcons.forEach(icon => {
      icon.addEventListener('click', function() {
        const targetPanel = document.getElementById(this.id.replace('tool', 'panel'));
        
        // Close all panels first
        toolPanels.forEach(panel => {
          panel.classList.remove('active');
        });
        
        toolIcons.forEach(icon => {
          icon.classList.remove('active');
        });
        
        // Activate selected panel
        if (targetPanel) {
          targetPanel.classList.add('active');
          this.classList.add('active');
        }
        
        // Handle special case for new article
        if (this.id === 'new-article') {
          window.location.href = '/create_article.html';
        }
      });
    });
    
    // Close Panel Buttons
    document.querySelectorAll('.close-panel').forEach(button => {
      button.addEventListener('click', function() {
        this.closest('.tool-panel').classList.remove('active');
        toolIcons.forEach(icon => {
          icon.classList.remove('active');
        });
      });
    });
    
    // Chat Window Toggle
    document.getElementById('chat-toggle').addEventListener('click', function() {
      document.getElementById('chat-window').classList.toggle('active');
    });
    
    document.getElementById('chat-close').addEventListener('click', function() {
      document.getElementById('chat-window').classList.remove('active');
    });
    
    // Image caption generation
    document.getElementById('imageForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('loadingIndicator').style.display = 'block';
      document.getElementById('captionResult').innerText = '';
      document.getElementById('captionResultCard').style.display = 'none';
      
      const formData = new FormData(this);

      try {
        const response = await fetch('/generate_tamil_from_image', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('captionResultCard').style.display = 'block';
        
        if (data.error) {
          document.getElementById('captionResult').innerText = 'பிழை: ' + data.error;
        } else {
          document.getElementById('captionResult').innerText = data.caption || 'பிழை: விளக்கம் கிடைக்கவில்லை.';
        }
      } catch (error) {
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('captionResultCard').style.display = 'block';
        document.getElementById('captionResult').innerText = 'பிழை: ' + error.message;
      }
    });

    // Voice recognition
    function startVoiceRecognition() {
      if ('webkitSpeechRecognition' in window) {
        var indicator = $('<div>').text('🎙️ குரல் பதிவு செய்கிறது...')
          .css({
            position: 'fixed',
            top: '50%', left: '50%',
            transform: 'translate(-50%, -50%)',
            backgroundColor: isDarkTheme ? '#333' : 'black', 
            color: 'white',
            padding: '20px', borderRadius: '10px',
            fontSize: '18px', zIndex: '10001'
          });
        $('body').append(indicator);

        var recognition = new webkitSpeechRecognition();
        recognition.lang = 'ta-IN';
        recognition.start();

        recognition.onresult = function(event) {
          var result = event.results[0][0].transcript;
          indicator.remove();
          document.getElementById('wikiFrame').src = "https://ta.wikipedia.org/w/index.php?search=" + encodeURIComponent(result);
        };
        recognition.onerror = function() {
          indicator.remove();
          alert('பிழை ஏற்பட்டது!');
        };
        recognition.onend = function() { indicator.remove(); };
      } else {
        alert('உங்கள் உலாவி குரலை ஆதரிக்கவில்லை.');
      }
    }

    // Content suggestion
    function suggestMissingContent() {
      let content = document.getElementById('content').value;
      if (!content.trim()) {
        alert('தயவுசெய்து உள்ளடக்கத்தை உள்ளிடவும்!');
        return;
      }
      
      document.getElementById('suggestionLoading').style.display = 'block';
      document.getElementById('suggestionResultCard').style.display = 'none';
      
      fetch('/suggest_missing_content', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('suggestionLoading').style.display = 'none';
        document.getElementById('suggestionResultCard').style.display = 'block';
        document.getElementById('suggestionResult').innerText = data.suggestion || 'பரிந்துரை கிடைக்கவில்லை.';
      })
      .catch(error => {
        document.getElementById('suggestionLoading').style.display = 'none';
        document.getElementById('suggestionResultCard').style.display = 'block';
        document.getElementById('suggestionResult').innerText = 'பிழை: ' + error.message;
      });
    }

    // Chatbot
    document.getElementById('chatSend').addEventListener('click', sendChatMessage);
    document.getElementById('chatMessage').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
      }
    });
    
    function sendChatMessage() {
      let message = document.getElementById('chatMessage').value;
      if (!message.trim()) return;
      
      // Add user message to chat
      addMessage(message, 'user');
      document.getElementById('chatMessage').value = '';
      
      // Add loading indicator
      const loadingElement = document.createElement('div');
      loadingElement.className = 'loading-text';
      loadingElement.innerHTML = '<div class="loading"></div> பதில் பெறுகிறது...';
      loadingElement.id = 'chatLoadingIndicator';
      document.getElementById('chat-messages').appendChild(loadingElement);
      
      // Scroll to bottom
      const chatMessages = document.getElementById('chat-messages');
      chatMessages.scrollTop = chatMessages.scrollHeight;
      
      // Send to server
      fetch('/chatbot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      })
      .then(response => response.json())
      .then(data => {
        // Remove loading indicator
        document.getElementById('chatLoadingIndicator').remove();
        
        // Add bot response
        if (data.error) {
          addMessage('பிழை: ' + data.error, 'bot');
        } else {
          addMessage(data.response || 'பதில் பெற முடியவில்லை.', 'bot');
        }
      })
      .catch(error => {
        // Remove loading indicator
        document.getElementById('chatLoadingIndicator').remove();
        
        // Add error message
        addMessage('பிழை ஏற்பட்டது: ' + error.message, 'bot');
      });
    }
    
    function addMessage(text, sender) {
      const messageElement = document.createElement('div');
      messageElement.className = `message ${sender}-message`;
      messageElement.textContent = text;
      
      const chatMessages = document.getElementById('chat-messages');
      chatMessages.appendChild(messageElement);
      
      // Scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>
